<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Informe protegido · Empieza de Cero</title>
<style>
  :root{--paper:#f7f5ef;--ink:#16202b;--muted:#4d5661;--line:#d9d5c8;--white:#fffdf8;--green:#1f6b4f}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:grid;place-items:center;padding:24px}
  .card{width:100%;max-width:390px;background:var(--white);border:1px solid var(--line);padding:34px 32px 28px}
  .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  h1{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-weight:600;font-size:27px;
    line-height:1.2;margin:0 0 8px;letter-spacing:-.01em}
  p{color:var(--muted);font-size:14px;margin:0 0 22px}
  label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  input{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--line);background:#fff;color:var(--ink);
    border-radius:3px;min-height:44px}
  input:focus{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green)}
  button{width:100%;margin-top:12px;padding:12px 16px;min-height:44px;border:0;border-radius:3px;
    background:var(--ink);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  button:hover{background:#24313f}
  button:disabled{opacity:.6;cursor:progress}
  button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
  .err{color:#a4362b;font-size:13px;margin:12px 0 0;min-height:18px}
  .foot{margin:22px 0 0;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<main class="card">
  <p class="kicker">Weaves · informe privado</p>
  <h1>Informe de campañas</h1>
  <p>Empieza de Cero · Kommo · 3 y 6 de noviembre de 2026. Introduce la contraseña para abrirlo.</p>
  <form id="f" autocomplete="off">
    <label for="pw">Contraseña</label>
    <input id="pw" name="pw" type="password" autocomplete="current-password" autofocus required spellcheck="false">
    <button id="b" type="submit">Abrir informe</button>
    <p class="err" id="e" role="alert" aria-live="polite"></p>
  </form>
  <p class="foot">El fichero publicado está cifrado (AES-256). Sin la contraseña no se puede leer, ni desde el código fuente.</p>
</main>
